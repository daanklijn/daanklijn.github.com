<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2×2 Convolution over a 3×3 Image</title>
<style>
  :root{
    --ink:#1c1f26;
    --sub:#6b7280;
    --line:#e4e7ec;
    --paper:#ffffff;
    --cell:#f7f8fa;
    --accent:#3457d5;
    --accent-soft:#e8ecfd;
    --accent-line:#c2cbf7;
    --good:#1f8a5f;
    --mono: "SFMono-Regular", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    font-family:var(--sans);
    color:var(--ink);
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:36px 24px 40px;
  }

  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px;
  }

  h1{
    font-size:19px;
    font-weight:650;
    letter-spacing:-0.01em;
    margin:0 0 6px;
    color:var(--ink);
  }

  .sub{
    font-size:13.5px;
    color:var(--sub);
    margin:0 0 26px;
    line-height:1.5;
  }

  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:34px;
    flex-wrap:wrap;
    padding:20px 10px 8px;
  }

  .panel-label{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--sub);
    text-align:center;
    margin-bottom:10px;
  }

  .grid3{
    position:relative;
    display:grid;
    grid-template-columns:repeat(3,52px);
    grid-template-rows:repeat(3,52px);
    gap:4px;
    padding:4px;
    background:var(--line);
    border-radius:10px;
  }

  .grid2out{
    display:grid;
    grid-template-columns:repeat(2,52px);
    grid-template-rows:repeat(2,52px);
    gap:4px;
    padding:4px;
    background:var(--line);
    border-radius:10px;
  }

  .cell{
    background:var(--cell);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    transition:background .35s ease, color .35s ease, box-shadow .35s ease;
  }

  .out-cell{
    background:var(--cell);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--mono);
    font-size:15px;
    font-weight:600;
    color:var(--sub);
    transition:background .35s ease, color .35s ease, box-shadow .4s ease, transform .35s ease;
  }

  .out-cell.filled{
    background:var(--accent-soft);
    color:var(--accent);
    box-shadow:inset 0 0 0 1.5px var(--accent-line);
  }

  .out-cell.pop{
    animation:pop .45s ease;
  }

  @keyframes pop{
    0%{transform:scale(1);}
    45%{transform:scale(1.12);}
    100%{transform:scale(1);}
  }

  /* kernel overlay: a 2x2 highlighted frame that glides over the 3x3 grid */
  .kernel{
    position:absolute;
    width:108px;
    height:108px;
    border:2px solid var(--accent);
    border-radius:8px;
    background:rgba(52,87,213,0.07);
    box-shadow:0 0 0 3px rgba(52,87,213,0.06);
    pointer-events:none;
    transition:transform .55s cubic-bezier(.65,0,.35,1);
    top:4px;
    left:4px;
  }

  .active .cell{
    background:transparent;
  }

  .cell.in-kernel{
    color:var(--accent);
  }

  .math{
    font-family:var(--mono);
    font-size:13.5px;
    color:var(--sub);
    text-align:center;
    min-height:20px;
    margin-top:22px;
    letter-spacing:.01em;
  }

  .math .val{
    color:var(--accent);
    font-weight:650;
  }

  .arrow{
    font-family:var(--mono);
    font-size:20px;
    color:var(--sub);
    padding-top:14px;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:30px;
  }

  button{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    color:var(--paper);
    background:var(--accent);
    border:none;
    padding:9px 18px;
    border-radius:8px;
    cursor:pointer;
    transition:opacity .2s ease, transform .15s ease;
  }

  button:hover{opacity:.88;}
  button:active{transform:scale(.97);}

  button.ghost{
    background:transparent;
    color:var(--sub);
    box-shadow:inset 0 0 0 1.5px var(--line);
  }
  button.ghost:hover{
    color:var(--ink);
    box-shadow:inset 0 0 0 1.5px var(--sub);
  }

  .step-dots{
    display:flex;
    gap:6px;
    justify-content:center;
    margin-top:16px;
  }

  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--line);
    transition:background .25s ease, transform .25s ease;
  }
  .dot.on{
    background:var(--accent);
    transform:scale(1.25);
  }

  .foot{
    text-align:center;
    font-size:11.5px;
    color:var(--sub);
    margin-top:26px;
    font-family:var(--mono);
  }

  @media (max-width:480px){
    .stage{gap:18px;}
    .grid3{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);}
    .kernel{width:88px;height:88px;}
    .grid2out{grid-template-columns:repeat(2,42px);grid-template-rows:repeat(2,42px);}
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Convolution basics</p>
  <h1>A 2×2 kernel sliding over a 3×3 image</h1>
  <p class="sub">The highlighted window scans across every valid position. At each stop, the four covered pixels are multiplied by the kernel's weights and summed into one output pixel.</p>

  <div class="stage">
    <div>
      <div class="panel-label">Input (3×3)</div>
      <div class="grid3" id="inputGrid"></div>
    </div>

    <div class="arrow">→</div>

    <div>
      <div class="panel-label">Output (2×2)</div>
      <div class="grid2out" id="outputGrid"></div>
    </div>
  </div>

  <p class="math" id="mathLine">&nbsp;</p>

  <div class="step-dots" id="stepDots"></div>

  <div class="controls">
    <button class="ghost" id="replayBtn">Replay</button>
    <button id="playBtn">Pause</button>
  </div>

  <p class="foot">kernel = [[1, 0], [0, -1]] &nbsp;·&nbsp; stride 1</p>
</div>

<script>
(function(){
  // 3x3 input image values
  const input = [
    [4, 1, 2],
    [0, 3, 1],
    [2, 1, 5]
  ];

  // 2x2 kernel weights
  const kernel = [
    [1, 0],
    [0, -1]
  ];

  // The four top-left positions the 2x2 kernel can sit at over a 3x3 image
  const positions = [
    {r:0,c:0}, {r:0,c:1},
    {r:1,c:0}, {r:1,c:1}
  ];

  const CELL = 52, GAP = 4, PAD = 4; // must match CSS
  function cellSize(){
    // responsive: read actual rendered size from the DOM
    const first = document.querySelector('#inputGrid .cell');
    return first ? first.getBoundingClientRect().width : CELL;
  }

  const inputGrid = document.getElementById('inputGrid');
  const outputGrid = document.getElementById('outputGrid');
  const kernelEl = document.createElement('div');
  kernelEl.className = 'kernel';
  inputGrid.classList.add('active');
  inputGrid.appendChild(kernelEl);

  // build input cells
  const inputCells = [];
  for(let r=0;r<3;r++){
    inputCells.push([]);
    for(let c=0;c<3;c++){
      const el = document.createElement('div');
      el.className = 'cell';
      el.textContent = input[r][c];
      inputGrid.appendChild(el);
      inputCells[r].push(el);
    }
  }

  // build output cells (in DOM order: 0,0 / 0,1 / 1,0 / 1,1)
  const outputCells = [];
  positions.forEach(()=>{
    const el = document.createElement('div');
    el.className = 'out-cell';
    el.textContent = '';
    outputGrid.appendChild(el);
    outputCells.push(el);
  });

  const dotsWrap = document.getElementById('stepDots');
  const dots = [];
  positions.forEach(()=>{
    const d = document.createElement('div');
    d.className = 'dot';
    dotsWrap.appendChild(d);
    dots.push(d);
  });

  const mathLine = document.getElementById('mathLine');
  const playBtn = document.getElementById('playBtn');
  const replayBtn = document.getElementById('replayBtn');

  function clearKernelHighlight(){
    inputCells.flat().forEach(el => el.classList.remove('in-kernel'));
  }

  function positionKernel(r,c){
    const size = cellSize();
    const step = size + GAP;
    kernelEl.style.width = (size*2 + GAP) + 'px';
    kernelEl.style.height = (size*2 + GAP) + 'px';
    kernelEl.style.transform = `translate(${c*step}px, ${r*step}px)`;
  }

  function computeAt(r,c){
    let sum = 0;
    let terms = [];
    for(let i=0;i<2;i++){
      for(let j=0;j<2;j++){
        const v = input[r+i][c+j];
        const w = kernel[i][j];
        sum += v*w;
        terms.push(`${v}×${w}`);
      }
    }
    return {sum, terms};
  }

  let step = 0;
  let timer = null;
  let playing = true;
  const STEP_MS = 1500;

  function renderStep(idx){
    const {r,c} = positions[idx];
    positionKernel(r,c);

    clearKernelHighlight();
    for(let i=0;i<2;i++){
      for(let j=0;j<2;j++){
        inputCells[r+i][c+j].classList.add('in-kernel');
      }
    }

    dots.forEach((d,i)=> d.classList.toggle('on', i===idx));

    const {sum, terms} = computeAt(r,c);
    mathLine.innerHTML = `${terms.join(' + ')} = <span class="val">${sum}</span>`;

    // reveal the corresponding output cell shortly after the kernel settles
    window.setTimeout(()=>{
      const oc = outputCells[idx];
      oc.textContent = sum;
      oc.classList.add('filled');
      oc.classList.remove('pop');
      void oc.offsetWidth; // restart animation
      oc.classList.add('pop');
    }, 380);
  }

  function resetOutputs(){
    outputCells.forEach(el=>{
      el.textContent='';
      el.classList.remove('filled','pop');
    });
    dots.forEach(d=>d.classList.remove('on'));
    mathLine.innerHTML = '&nbsp;';
  }

  function tick(){
    renderStep(step);
    step = (step+1) % positions.length;
    if(step === 0){
      // pause a beat on the full output, then loop
      timer = setTimeout(()=>{
        resetOutputs();
        timer = setTimeout(tick, 250);
      }, STEP_MS + 500);
    } else {
      timer = setTimeout(tick, STEP_MS);
    }
  }

  function start(){
    playing = true;
    playBtn.textContent = 'Pause';
    tick();
  }

  function stop(){
    playing = false;
    playBtn.textContent = 'Play';
    clearTimeout(timer);
  }

  playBtn.addEventListener('click', ()=>{
    if(playing){ stop(); }
    else { start(); }
  });

  replayBtn.addEventListener('click', ()=>{
    clearTimeout(timer);
    step = 0;
    resetOutputs();
    if(!playing){ playing = true; playBtn.textContent='Pause'; }
    tick();
  });

  // initial position before animation starts
  window.addEventListener('load', ()=>{
    positionKernel(0,0);
    start();
  });
  // in case load already fired (artifact re-render)
  if(document.readyState === 'complete'){
    positionKernel(0,0);
    start();
  }
})();
</script>

</body>
</html>
